<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#96261D">
<title>重庆大学建筑城规学院 · 新生入学助手</title>
<style>
/* ============================================================
   配色变量 —— 想改颜色只动这里
   ============================================================ */
:root{
  --brand:        #96261D;   /* 主色：重大红 */
  --brand-deep:   #7A1D16;   /* 主色加深，用于渐变 */
  --brand-soft:   #FBF1EF;   /* 主色极浅，用于背景点缀 */
  --page-bg:      #F6F4F1;   /* 页面底色 */
  --card:         #FFFFFF;   /* 卡片/气泡底色 */
  --text:         #221C1A;   /* 正文 */
  --text-2:       #6B615C;   /* 次要文字 */
  --text-3:       #9A8F89;   /* 弱化文字 */
  --line:         #EAE4DF;   /* 描边 */
  --radius:       16px;
  --shadow:       0 2px 12px rgba(34,28,26,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--page-bg); color:var(--text);
  font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

/* ---------- 整体骨架 ---------- */
.app{display:flex;flex-direction:column;height:100dvh;height:100vh}
@supports (height:100dvh){.app{height:100dvh}}

/* ---------- 顶栏 ---------- */
.header{
  flex:none;position:relative;z-index:10;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-deep) 100%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  box-shadow:0 2px 14px rgba(122,29,22,.22);
}
.header-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:11px}
.logo{
  flex:none;width:38px;height:38px;border-radius:11px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.titles{flex:1;min-width:0}
.title{font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:11.5px;opacity:.78;margin-top:2px;letter-spacing:.3px}
.btn-reset{
  flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  color:#fff;font-size:12px;padding:6px 11px;border-radius:9px;cursor:pointer;
  font-family:inherit;transition:background .18s;white-space:nowrap;
}
.btn-reset:hover{background:rgba(255,255,255,.26)}

/* ---------- 消息区 ---------- */
.main{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 16px 8px;scroll-behavior:smooth;
}
.wrap{max-width:760px;margin:0 auto}

/* ---------- 欢迎卡片 ---------- */
.welcome{padding:10px 0 6px;animation:fade .45s ease both}
.welcome-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;box-shadow:var(--shadow);
}
.welcome-hi{font-size:17px;font-weight:600;margin:0 0 8px}
.welcome-p{font-size:13.5px;color:var(--text-2);margin:0 0 16px;line-height:1.75}
.chips-label{font-size:12px;color:var(--text-3);margin:0 0 9px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-family:inherit;font-size:13px;color:var(--brand);
  background:var(--brand-soft);border:1px solid #F0DAD6;border-radius:999px;
  padding:7px 13px;cursor:pointer;transition:all .18s;text-align:left;
}
.chip:hover{background:#F7E3E0;transform:translateY(-1px)}
.chip:active{transform:translateY(0)}

/* ---------- 消息气泡 ---------- */
.msg{display:flex;gap:9px;margin-bottom:16px;animation:fade .3s ease both}
.msg.user{flex-direction:row-reverse}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  flex:none;width:29px;height:29px;border-radius:9px;font-size:14px;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.msg.bot .avatar{background:var(--brand-soft);border:1px solid #F0DAD6}
.msg.user .avatar{background:#EFEAE6;border:1px solid var(--line)}
.bubble{
  max-width:calc(100% - 84px);padding:11px 14px;border-radius:14px;
  font-size:14.5px;word-break:break-word;overflow-wrap:anywhere;
}
.msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:5px;box-shadow:var(--shadow)}
.msg.user .bubble{background:var(--brand);color:#fff;border-top-right-radius:5px;box-shadow:0 2px 10px rgba(150,38,29,.18)}
.msg.error .bubble{background:#FFF6F4;border-color:#F3D3CC;color:#94301F;white-space:pre-wrap}

/* 气泡内的排版 */
.bubble p{margin:0 0 9px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
  font-size:14.5px;font-weight:600;margin:14px 0 7px;padding-left:9px;
  border-left:3px solid var(--brand);line-height:1.5;
}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child,.bubble h4:first-child{margin-top:0}
.bubble ul,.bubble ol{margin:0 0 9px;padding-left:19px}
.bubble li{margin-bottom:4px}
.bubble li:last-child{margin-bottom:0}
.bubble strong{font-weight:600}
.bubble code{
  background:#F2EDE9;border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.bubble pre{
  background:#2B2523;color:#F0EAE6;padding:12px;border-radius:10px;
  overflow-x:auto;margin:0 0 9px;font-size:12.5px;line-height:1.6;
}
.bubble pre code{background:none;border:none;color:inherit;padding:0}
.bubble blockquote{
  margin:0 0 9px;padding:2px 0 2px 11px;border-left:3px solid var(--line);
  color:var(--text-2);font-size:13.5px;
}
.bubble a{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.msg.user .bubble a{color:#fff}
.bubble table{
  border-collapse:collapse;width:100%;margin:0 0 9px;font-size:13px;
  display:block;overflow-x:auto;white-space:nowrap;
}
.bubble th,.bubble td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.bubble th{background:#FAF7F5;font-weight:600}

/* ---------- 等待动画 ---------- */
.dots{display:inline-flex;gap:4px;align-items:center;height:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:#C9BDB7;animation:blink 1.3s infinite both}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.28;transform:scale(.86)}40%{opacity:1;transform:scale(1)}}
.caret{display:inline-block;width:2px;height:15px;background:var(--brand);vertical-align:-2px;margin-left:2px;animation:caret .9s steps(2) infinite}
.wait-tip{font-size:13px;color:var(--text-3);margin-left:7px;vertical-align:1px}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ---------- 底部输入区 ---------- */
.composer{
  flex:none;background:rgba(246,244,241,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
}
.composer-inner{max-width:760px;margin:0 auto}
.input-row{
  display:flex;gap:9px;align-items:flex-end;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 15px;
  box-shadow:var(--shadow);transition:border-color .2s;
}
.input-row:focus-within{border-color:#D9B8B2}
textarea{
  flex:1;border:none;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--text);
  max-height:120px;min-height:24px;padding:6px 0;
}
textarea::placeholder{color:var(--text-3)}
.btn-send{
  flex:none;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.btn-send:hover:not(:disabled){background:var(--brand-deep);transform:scale(1.06)}
.btn-send:disabled{background:#DED6D1;cursor:not-allowed}
.btn-send svg{width:17px;height:17px}
.tips{
  font-size:11px;color:var(--text-3);text-align:center;
  margin-top:8px;line-height:1.6;
}

/* ---------- 滚动条 ---------- */
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:#DDD4CE;border-radius:3px}
.main::-webkit-scrollbar-track{background:transparent}

@media (max-width:400px){
  .bubble{max-width:calc(100% - 46px)}
  .title{font-size:15px}
}
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">🎓</div>
      <div class="titles">
        <div class="title">新生入学助手</div>
        <div class="subtitle">重庆大学 · 建筑城规学院</div>
      </div>
      <button class="btn-reset" id="btnReset" title="清空对话，重新开始">重新开始</button>
    </div>
  </header>

  <!-- 消息区 -->
  <main class="main" id="main">
    <div class="wrap" id="wrap">
      <!-- 欢迎卡片（发出第一条消息后自动移除） -->
      <section class="welcome" id="welcome">
        <div class="welcome-card">
          <h2 class="welcome-hi">你好，欢迎来到建筑城规学院 👋</h2>
          <p class="welcome-p">
            我是学院的新生入学助手。报到注册、宿舍住宿、医保参保、奖助学金、培养方案、校园班车……
            凡是入学相关的问题，都可以直接问我。我会依据学院的官方文件来回答，并尽量告诉你出自哪份通知。
          </p>
          <p class="chips-label">你可以从这些开始问 ↓</p>
          <div class="chips" id="chips">
            <button class="chip">新生报到需要准备哪些材料？</button>
            <button class="chip">研究生英语免修要满足什么条件？</button>
            <button class="chip">医保参保怎么办理，要交多少钱？</button>
            <button class="chip">学业奖学金是怎么评定的？</button>
            <button class="chip">沙坪坝校区的穿梭巴士几点发车？</button>
            <button class="chip">宿舍是怎么分配的？</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 输入区 -->
  <footer class="composer">
    <div class="composer-inner">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入你的问题…" maxlength="500"></textarea>
        <button class="btn-send" id="btnSend" disabled aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <p class="tips">
        助手依据学院文件生成回答，仅供参考，最终以学院官方通知为准 · 请勿提问个人隐私信息
      </p>
    </div>
  </footer>

</div>

<script>
(function(){
  'use strict';

  var main     = document.getElementById('main');
  var wrap     = document.getElementById('wrap');
  var welcome  = document.getElementById('welcome');
  var input    = document.getElementById('input');
  var btnSend  = document.getElementById('btnSend');
  var btnReset = document.getElementById('btnReset');
  var chips    = document.getElementById('chips');

  /* ----------------------------------------------------------
     接口地址（同一份网页，三种打开方式都能用）
       双击「本地预览.bat」→ localhost:3210，走同一个网址下的 /api/chat
       双击 index.html 文件 → 直接连阿里云
       放上 GitHub Pages    → 直接连阿里云
     ---------------------------------------------------------- */
  var IS_LOCAL_SERVER = (location.hostname === 'localhost' ||
                         location.hostname === '127.0.0.1');

  var API_BASE = IS_LOCAL_SERVER
    ? ''
    : 'https://cqu-frean-guide-bwhdljnbcg.cn-hangzhou.fcapp.run';

  var busy = false;               // 是否正在等待回答
  var sessionId = sessionStorage.getItem('cqu_sid') || '';

  /* ==========================================================
     一、Markdown 渲染（自己实现，不引第三方库）
     先转义 HTML，再套用格式，杜绝注入
     ========================================================== */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // 知识库返回的文件链接又长又带签名参数，手机上能把气泡撑爆，
  // 所以显示成短标签，href 里仍是完整地址，点开照样能看原文
  function shortUrl(u){
    if (u.length <= 48) return u;
    var name = '';
    try { name = decodeURIComponent(u.split('?')[0].split('/').pop() || ''); } catch (e) { name = ''; }
    if (name && name.length <= 26 && /\.(pdf|docx?|txt|md|pptx?|xlsx?)$/i.test(name)) {
      return '📄 ' + name;
    }
    return '📄 原文链接';
  }

  function linkTag(url, text){
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' +
           (text.length > 48 ? shortUrl(text) : text) + '</a>';
  }

  // 行内格式：粗体、斜体、行内代码、链接
  function inline(s){
    return s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, function(m, text, url){
        return linkTag(url, text);
      })
      // 裸链接。注意：这里刻意不用「后行断言」，因为老版 iOS Safari 不支持，
      // 一旦语法报错整个页面会白屏。改成手工看前一个字符。
      .replace(/(https?:\/\/[^\s<]+)/g, function(m, url, offset, whole){
        var prev = offset > 0 ? whole.charAt(offset - 1) : '';
        if (prev && /[\w"'>=/]/.test(prev)) return m;   // 已在 href 属性里，别重复包装
        return linkTag(url, url);
      });
  }

  function splitRow(line){
    return line.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return c.trim(); });
  }

  function renderMarkdown(src){
    // 1. 先把代码块抠出来占位，避免里面的符号被当成格式
    var codes = [];
    var t = String(src).replace(/```[^\n]*\n?([\s\S]*?)```/g, function(m, code){
      codes.push(code.replace(/\n$/, ''));
      return '\u0001C' + (codes.length - 1) + '\u0001';
    });

    // 2. 整体转义
    t = esc(t);
    var lines = t.split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      // 代码块占位符
      var cm = line.match(/^\u0001C(\d+)\u0001$/);
      if (cm){
        out.push('<pre><code>' + esc(codes[+cm[1]]) + '</code></pre>');
        i++; continue;
      }

      // 表格：本行是 |...|，下一行是 |---|---|
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
          /^\s*\|[\s:|\-]+\|\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') > -1){
        var head = splitRow(line), rows = [], j = i + 2;
        while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])){
          rows.push(splitRow(lines[j])); j++;
        }
        var tb = '<table><thead><tr>';
        head.forEach(function(c){ tb += '<th>' + inline(c) + '</th>'; });
        tb += '</tr></thead><tbody>';
        rows.forEach(function(r){
          tb += '<tr>';
          for (var k = 0; k < head.length; k++) tb += '<td>' + inline(r[k] || '') + '</td>';
          tb += '</tr>';
        });
        out.push(tb + '</tbody></table>');
        i = j; continue;
      }

      // 标题
      var hm = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (hm){
        var lv = Math.min(hm[1].length + 1, 4);
        out.push('<h' + lv + '>' + inline(hm[2]) + '</h' + lv + '>');
        i++; continue;
      }

      // 分隔线
      if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)){ out.push('<hr>'); i++; continue; }

      // 引用（注意：> 在前面的转义步骤里已经变成了 &gt;，两种都要认）
      if (/^\s*(?:&gt;|>)\s?/.test(line)){
        var qb = [];
        while (i < lines.length && /^\s*(?:&gt;|>)\s?/.test(lines[i])){
          qb.push(lines[i].replace(/^\s*(?:&gt;|>)\s?/, '')); i++;
        }
        out.push('<blockquote>' + inline(qb.join('<br>')) + '</blockquote>');
        continue;
      }

      // 列表（有序 / 无序）
      var lm = line.match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
      if (lm){
        var ordered = /\d/.test(lm[2]);
        var tag = ordered ? 'ol' : 'ul';
        var items = [];
        while (i < lines.length){
          var m2 = lines[i].match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
          if (!m2 || /\d/.test(m2[2]) !== ordered) break;
          var txt = m2[3];
          // 收拢该项的续行（缩进对齐的下一行）
          i++;
          while (i < lines.length && lines[i].trim() &&
                 !/^(\s*)([-*+]|\d+[.、)])\s+/.test(lines[i]) &&
                 !/^\s*(#{1,6}\s|&gt;|\|)/.test(lines[i]) &&
                 /^\s{2,}/.test(lines[i])){
            txt += '<br>' + lines[i].trim(); i++;
          }
          items.push('<li>' + inline(txt) + '</li>');
        }
        out.push('<' + tag + '>' + items.join('') + '</' + tag + '>');
        continue;
      }

      // 空行
      if (!line.trim()){ i++; continue; }

      // 普通段落
      var pb = [];
      while (i < lines.length && lines[i].trim() &&
             !/^\s*(#{1,6}\s|&gt;|\||```)/.test(lines[i]) &&
             !/^(\s*)([-*+]|\d+[.、)])\s+/.test(lines[i]) &&
             !/^\s*\u0001C\d+\u0001$/.test(lines[i])){
        pb.push(lines[i]); i++;
      }
      if (pb.length) out.push('<p>' + inline(pb.join('<br>')) + '</p>');
    }
    return out.join('');
  }

  /* ==========================================================
     二、界面渲染
     ========================================================== */
  function scrollBottom(){
    // 等一帧，让新内容先撑开高度
    requestAnimationFrame(function(){ main.scrollTop = main.scrollHeight; });
  }

  // 欢迎卡片只是藏起来，不删掉，这样「重新开始」能原样复原
  function hideWelcome(){ if (welcome) welcome.style.display = 'none'; }
  function showWelcome(){
    if (!welcome) return;
    welcome.style.display = '';
    // 移除它后面的所有消息
    Array.prototype.slice.call(wrap.querySelectorAll('.msg')).forEach(function(el){ el.remove(); });
  }

  function addMessage(role, text){
    var el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? '🙋' : '🎓';

    var bb = document.createElement('div');
    bb.className = 'bubble';
    if (role === 'user'){ bb.textContent = text; }
    else { bb.innerHTML = renderMarkdown(text); }

    el.appendChild(av); el.appendChild(bb);
    wrap.appendChild(el);
    scrollBottom();
    return bb;
  }

  function addTyping(){
    var el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = '<div class="avatar">🎓</div>' +
                   '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    wrap.appendChild(el);
    scrollBottom();
    return el;
  }

  function addError(text){
    var el = document.createElement('div');
    el.className = 'msg bot error';
    el.innerHTML = '<div class="avatar">⚠️</div><div class="bubble"></div>';
    el.querySelector('.bubble').textContent = text;
    wrap.appendChild(el);
    scrollBottom();
  }

  function setBusy(v){
    busy = v;
    btnSend.disabled = v || !input.value.trim();
    input.disabled = v;
  }

  /* ==========================================================
     三、发送 & 流式接收
     ========================================================== */
  function ask(prompt){
    if (busy || !prompt) return;

    hideWelcome();
    addMessage('user', prompt);

    input.value = '';
    input.style.height = 'auto';
    setBusy(true);

    var typing  = addTyping();
    var bubble  = typing.querySelector('.bubble');
    var full    = '';
    var started = false;
    var failed  = false;

    // 这个助手是「想完了才一次性给答案」，要等十几到几十秒。
    // 光转三个点会让人以为卡死，所以按时间给几句进度提示。
    var timerA = null, timerB = null, timerC = null;
    timerA = setTimeout(function(){
      if (started || failed) return;
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                         '<span class="wait-tip">正在检索学院文件…</span>';
      scrollBottom();
    }, 3000);
    timerB = setTimeout(function(){
      if (started || failed) return;
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                         '<span class="wait-tip">正在整理答案，请稍候…</span>';
      scrollBottom();
    }, 12000);
    timerC = setTimeout(function(){
      if (started || failed) return;
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                         '<span class="wait-tip">问题比较复杂，还在思考中…</span>';
      scrollBottom();
    }, 30000);

    function clearWaitTimers(){
      clearTimeout(timerA); clearTimeout(timerB); clearTimeout(timerC);
    }

    // 出错时的收尾
    function fail(message){
      failed = true;
      clearWaitTimers();
      if (typing.parentNode) typing.remove();
      addError(message);
      // 让服务端忘掉这一轮，免得上下文错乱
      sessionId = '';
      sessionStorage.removeItem('cqu_sid');
    }

    // 不管成功失败，最后都要走到这里：收尾、解锁输入框
    function finish(){
      clearWaitTimers();
      if (failed){
        /* fail() 里已经收拾过了 */
      } else if (full){
        // 等待动画就地「转正」成正式答案，只去掉闪烁光标
        bubble.innerHTML = renderMarkdown(full);
      } else {
        if (typing.parentNode) typing.remove();
        addError('助手这次没有返回内容，请再问一次试试。');
      }
      setBusy(false);
      if (window.innerWidth > 640) input.focus();
      scrollBottom();
    }

    fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, session_id: sessionId || undefined })
    })
    .then(function(resp){
      if (!resp.ok){
        return resp.text().then(function(t){
          var m = t;
          try { m = JSON.parse(t).error || t; } catch (e) { /* 不是 JSON 就直接用原文 */ }
          throw new Error(m || ('服务器返回 ' + resp.status));
        });
      }
      if (!resp.body) throw new Error('当前浏览器不支持流式接收');

      var reader  = resp.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';

      function pump(){
        return reader.read().then(function(r){
          if (r.done) return;

          buf += decoder.decode(r.value, { stream: true });

          // SSE 以空行分隔，最后一段可能不完整，留在缓冲里
          var parts = buf.split('\n\n');
          buf = parts.pop();

          for (var n = 0; n < parts.length; n++){
            var block = parts[n];
            var dataLines = block.split('\n').filter(function(l){
              return l.indexOf('data:') === 0;
            });
            if (!dataLines.length) continue;

            var payload = dataLines.map(function(l){ return l.slice(5).trim(); }).join('');
            if (payload === '[DONE]') return;

            var msg;
            try { msg = JSON.parse(payload); } catch (e){ continue; }

            if (msg.error) throw new Error(msg.error);

            if (msg.sid){ sessionId = msg.sid; sessionStorage.setItem('cqu_sid', msg.sid); }

            if (msg.t){
              if (!started){
                started = true;
                bubble.innerHTML = '';
              }
              full += msg.t;
              bubble.innerHTML = renderMarkdown(full) + '<span class="caret"></span>';
              scrollBottom();
            }
          }
          return pump();
        });
      }

      return pump();
    })
    .catch(function(err){
      fail('抱歉，没能拿到回答：' + (err && err.message ? err.message : err) +
           '\n\n请稍后重试，或换个说法再问一次。');
    })
    .then(finish);
  }

  /* ==========================================================
     四、事件绑定
     ========================================================== */
  btnSend.addEventListener('click', function(){ ask(input.value.trim()); });

  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    btnSend.disabled = busy || !input.value.trim();
  });

  input.addEventListener('keydown', function(e){
    // 电脑上：回车发送，Shift+回车换行；手机上回车就是换行
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 640){
      e.preventDefault();
      ask(input.value.trim());
    }
  });

  chips.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if (btn) ask(btn.textContent.trim());
  });

  btnReset.addEventListener('click', function(){
    if (busy) return;
    if (!confirm('确定要清空当前对话，重新开始吗？')) return;
    sessionId = '';
    sessionStorage.removeItem('cqu_sid');
    showWelcome();
    main.scrollTop = 0;
  });

  // 进入页面时聚焦输入框（手机上不自动弹键盘）
  if (window.innerWidth > 640) input.focus();
})();
</script>
</body>
</html>
