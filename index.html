<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#96261D">
<title>重庆大学建筑城规学院 · 新生入学助手</title>
<style>
/* ============================================================
   配色变量 —— 想改颜色只动这里
   ============================================================ */
:root{
  --brand:        #96261D;   /* 主色：重大红 */
  --brand-deep:   #7A1D16;   /* 主色加深，用于渐变 */
  --brand-soft:   #FBF1EF;   /* 主色极浅，用于背景点缀 */
  --page-bg:      #F6F4F1;   /* 页面底色 */
  --card:         #FFFFFF;   /* 卡片/气泡底色 */
  --text:         #221C1A;   /* 正文 */
  --text-2:       #6B615C;   /* 次要文字 */
  --text-3:       #9A8F89;   /* 弱化文字 */
  --line:         #EAE4DF;   /* 描边 */
  --radius:       16px;
  --shadow:       0 2px 12px rgba(34,28,26,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--page-bg); color:var(--text);
  font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

/* ---------- 整体骨架 ---------- */
.app{display:flex;height:100dvh;height:100vh}
@supports (height:100dvh){.app{height:100dvh}}
.content{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- 左侧：历史对话 ---------- */
.sidebar{
  flex:none;width:238px;display:flex;flex-direction:column;
  background:#FFFFFF;border-right:1px solid var(--line);
}
.sb-head{flex:none;padding:15px 14px 11px;display:flex;align-items:center;gap:8px}
.sb-logo{
  flex:none;width:28px;height:28px;border-radius:8px;font-size:15px;
  background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.sb-title{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:.2px}
.sb-new{
  flex:none;margin:0 12px 8px;padding:9px 12px;border:none;border-radius:10px;
  font-family:inherit;font-size:13px;font-weight:500;color:#fff;
  background:var(--brand);cursor:pointer;transition:background .18s;
}
.sb-new:hover{background:var(--brand-deep)}
.sb-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px}
.sb-group{font-size:11px;color:var(--text-3);padding:11px 8px 5px;letter-spacing:.4px}
.sb-item{
  display:flex;align-items:center;gap:6px;padding:8px 6px 8px 10px;
  border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--text-2);
  line-height:1.45;transition:background .15s;
}
.sb-item:hover{background:#F7F4F1}
.sb-item.active{background:var(--brand-soft);color:var(--brand);font-weight:500}
.sb-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-del{
  flex:none;width:20px;height:20px;border:none;border-radius:6px;background:transparent;
  color:var(--text-3);cursor:pointer;font-size:15px;line-height:1;
  display:none;align-items:center;justify-content:center;font-family:inherit;
}
.sb-item:hover .sb-del{display:flex}
.sb-del:hover{background:#F0E4E2;color:var(--brand)}
.sb-empty{font-size:12px;color:var(--text-3);padding:6px 10px;line-height:1.75}
.sb-mask{display:none}
.btn-menu{
  display:none;flex:none;width:34px;height:34px;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  color:#fff;font-size:16px;line-height:1;align-items:center;justify-content:center;
  font-family:inherit;
}

/* ---------- 参考资料里的「下载原文」卡片 ---------- */
.filecard{
  display:inline-flex;align-items:center;gap:7px;max-width:100%;
  margin:3px 0;padding:6px 8px 6px 11px;border-radius:10px;
  background:var(--brand-soft);border:1px solid #F0DAD6;
  color:var(--brand);font-size:13px;cursor:pointer;
  transition:background .18s;vertical-align:middle;
}
.filecard:hover{background:#F7E3E0}
.filecard .fc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.filecard .fc-btn{
  flex:none;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:6px;
  background:var(--brand);color:#fff;white-space:nowrap;
}
.filecard.busy{opacity:.55;pointer-events:none}
.filecard.fail{background:#FFF4F2;border-color:#F3D3CC;color:#94301F}
.filecard.fail .fc-btn{background:#94301F}

/* ---------- 顶栏 ---------- */
.header{
  flex:none;position:relative;z-index:10;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-deep) 100%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  box-shadow:0 2px 14px rgba(122,29,22,.22);
}
.header-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:11px}
.logo{
  flex:none;width:38px;height:38px;border-radius:11px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.titles{flex:1;min-width:0}
.title{font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:11.5px;opacity:.78;margin-top:2px;letter-spacing:.3px}
.btn-reset{
  flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  color:#fff;font-size:12px;padding:6px 11px;border-radius:9px;cursor:pointer;
  font-family:inherit;transition:background .18s;white-space:nowrap;
}
.btn-reset:hover{background:rgba(255,255,255,.26)}

/* ---------- 消息区 ---------- */
.main{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 16px 8px;scroll-behavior:smooth;
}
.wrap{max-width:760px;margin:0 auto}

/* ---------- 欢迎卡片 ---------- */
.welcome{padding:10px 0 6px;animation:fade .45s ease both}
.welcome-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;box-shadow:var(--shadow);
}
.welcome-hi{font-size:17px;font-weight:600;margin:0 0 8px}
.welcome-p{font-size:13.5px;color:var(--text-2);margin:0 0 16px;line-height:1.75}
.chips-label{font-size:12px;color:var(--text-3);margin:0 0 9px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-family:inherit;font-size:13px;color:var(--brand);
  background:var(--brand-soft);border:1px solid #F0DAD6;border-radius:999px;
  padding:7px 13px;cursor:pointer;transition:all .18s;text-align:left;
}
.chip:hover{background:#F7E3E0;transform:translateY(-1px)}
.chip:active{transform:translateY(0)}

/* ---------- 消息气泡 ---------- */
.msg{display:flex;gap:9px;margin-bottom:16px;animation:fade .3s ease both}
.msg.user{flex-direction:row-reverse}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  flex:none;width:29px;height:29px;border-radius:9px;font-size:14px;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.msg.bot .avatar{background:var(--brand-soft);border:1px solid #F0DAD6}
.msg.user .avatar{background:#EFEAE6;border:1px solid var(--line)}
.bubble{
  max-width:calc(100% - 84px);padding:11px 14px;border-radius:14px;
  font-size:14.5px;word-break:break-word;overflow-wrap:anywhere;
}
.msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:5px;box-shadow:var(--shadow)}
.msg.user .bubble{background:var(--brand);color:#fff;border-top-right-radius:5px;box-shadow:0 2px 10px rgba(150,38,29,.18)}
.msg.error .bubble{background:#FFF6F4;border-color:#F3D3CC;color:#94301F;white-space:pre-wrap}

/* 气泡内的排版 */
.bubble p{margin:0 0 9px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
  font-size:14.5px;font-weight:600;margin:14px 0 7px;padding-left:9px;
  border-left:3px solid var(--brand);line-height:1.5;
}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child,.bubble h4:first-child{margin-top:0}
.bubble ul,.bubble ol{margin:0 0 9px;padding-left:19px}
.bubble li{margin-bottom:4px}
.bubble li:last-child{margin-bottom:0}
.bubble strong{font-weight:600}
.bubble code{
  background:#F2EDE9;border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.bubble pre{
  background:#2B2523;color:#F0EAE6;padding:12px;border-radius:10px;
  overflow-x:auto;margin:0 0 9px;font-size:12.5px;line-height:1.6;
}
.bubble pre code{background:none;border:none;color:inherit;padding:0}
.bubble blockquote{
  margin:0 0 9px;padding:2px 0 2px 11px;border-left:3px solid var(--line);
  color:var(--text-2);font-size:13.5px;
}
.bubble a{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.msg.user .bubble a{color:#fff}
.bubble table{
  border-collapse:collapse;width:100%;margin:0 0 9px;font-size:13px;
  display:block;overflow-x:auto;white-space:nowrap;
}
.bubble th,.bubble td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.bubble th{background:#FAF7F5;font-weight:600}

/* ---------- 等待动画 ---------- */
.dots{display:inline-flex;gap:4px;align-items:center;height:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:#C9BDB7;animation:blink 1.3s infinite both}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.28;transform:scale(.86)}40%{opacity:1;transform:scale(1)}}
.caret{display:inline-block;width:2px;height:15px;background:var(--brand);vertical-align:-2px;margin-left:2px;animation:caret .9s steps(2) infinite}
.wait-tip{font-size:13px;color:var(--text-3);margin-left:7px;vertical-align:1px}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ---------- 底部输入区 ---------- */
.composer{
  flex:none;background:rgba(246,244,241,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
}
.composer-inner{max-width:760px;margin:0 auto}
.input-row{
  display:flex;gap:9px;align-items:flex-end;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 15px;
  box-shadow:var(--shadow);transition:border-color .2s;
}
.input-row:focus-within{border-color:#D9B8B2}
textarea{
  flex:1;border:none;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--text);
  max-height:120px;min-height:24px;padding:6px 0;
}
textarea::placeholder{color:var(--text-3)}
.btn-send{
  flex:none;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.btn-send:hover:not(:disabled){background:var(--brand-deep);transform:scale(1.06)}
.btn-send:disabled{background:#DED6D1;cursor:not-allowed}
.btn-send svg{width:17px;height:17px}
.tips{
  font-size:11px;color:var(--text-3);text-align:center;
  margin-top:8px;line-height:1.6;
}

/* ---------- 滚动条 ---------- */
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:#DDD4CE;border-radius:3px}
.main::-webkit-scrollbar-track{background:transparent}

/* ---------- 宽屏：侧栏里已经有图标了，顶栏就不用重复 ---------- */
@media (min-width:821px){
  .header .logo{display:none}
}

/* ---------- 窄屏：侧栏收起来，改成抽屉 ---------- */
@media (max-width:820px){
  .btn-menu{display:flex}
  .sb-mask{
    display:block;position:fixed;inset:0;z-index:55;
    background:rgba(34,24,22,.42);
    opacity:0;pointer-events:none;transition:opacity .26s;
  }
  .sb-mask.show{opacity:1;pointer-events:auto}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:60;
    width:76%;max-width:290px;
    transform:translateX(-100%);
    transition:transform .26s ease;
    box-shadow:0 0 34px rgba(0,0,0,.2);
  }
  .sidebar.open{transform:none}
}

@media (max-width:400px){
  .bubble{max-width:calc(100% - 46px)}
  .title{font-size:15px}
}
</style>
</head>
<body>
<div class="app">

  <!-- 左侧：历史对话记录 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">🎓</div>
      <div class="sb-title">新生入学助手</div>
    </div>
    <button class="sb-new" id="btnNew">＋ 新对话</button>
    <div class="sb-list" id="sbList"></div>
  </aside>
  <div class="sb-mask" id="sbMask"></div>

  <div class="content">

  <!-- 顶栏 -->
  <header class="header">
    <div class="header-inner">
      <button class="btn-menu" id="btnMenu" title="历史对话">☰</button>
      <div class="logo">🎓</div>
      <div class="titles">
        <div class="title">新生入学助手</div>
        <div class="subtitle">重庆大学 · 建筑城规学院</div>
      </div>
      <button class="btn-reset" id="btnReset" title="开始一段新对话（旧的会留在左边）">新对话</button>
    </div>
  </header>

  <!-- 消息区 -->
  <main class="main" id="main">
    <div class="wrap" id="wrap">
      <!-- 欢迎卡片（发出第一条消息后自动移除） -->
      <section class="welcome" id="welcome">
        <div class="welcome-card">
          <h2 class="welcome-hi">你好，欢迎来到建筑城规学院 👋</h2>
          <p class="welcome-p">
            我是学院的新生入学助手。报到注册、宿舍住宿、医保参保、奖助学金、培养方案、校园班车……
            凡是入学相关的问题，都可以直接问我。我会依据学院的官方文件来回答，并尽量告诉你出自哪份通知。
          </p>
          <p class="chips-label">你可以从这些开始问 ↓</p>
          <div class="chips" id="chips">
            <button class="chip">新生报到需要准备哪些材料？</button>
            <button class="chip">研究生英语免修要满足什么条件？</button>
            <button class="chip">医保参保怎么办理，要交多少钱？</button>
            <button class="chip">学业奖学金是怎么评定的？</button>
            <button class="chip">沙坪坝校区的穿梭巴士几点发车？</button>
            <button class="chip">宿舍是怎么分配的？</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 输入区 -->
  <footer class="composer">
    <div class="composer-inner">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入你的问题…" maxlength="500"></textarea>
        <button class="btn-send" id="btnSend" disabled aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <p class="tips">
        助手依据学院文件生成回答，仅供参考，最终以学院官方通知为准 · 请勿提问个人隐私信息
      </p>
    </div>
  </footer>

  </div><!-- /.content -->

</div>

<script>
(function(){
  'use strict';

  var main     = document.getElementById('main');
  var wrap     = document.getElementById('wrap');
  var welcome  = document.getElementById('welcome');
  var input    = document.getElementById('input');
  var btnSend  = document.getElementById('btnSend');
  var btnReset = document.getElementById('btnReset');
  var chips    = document.getElementById('chips');

  // 左侧历史对话栏
  var sidebar  = document.getElementById('sidebar');
  var sbList   = document.getElementById('sbList');
  var sbMask   = document.getElementById('sbMask');
  var btnNew   = document.getElementById('btnNew');
  var btnMenu  = document.getElementById('btnMenu');

  /* ----------------------------------------------------------
     接口地址（同一份网页，三种打开方式都能用）
       双击「本地预览.bat」→ localhost:3210，走同一个网址下的 /api/chat
       双击 index.html 文件 → 直接连阿里云
       放上 GitHub Pages    → 直接连阿里云
     ---------------------------------------------------------- */
  var IS_LOCAL_SERVER = (location.hostname === 'localhost' ||
                         location.hostname === '127.0.0.1');

  var API_BASE = IS_LOCAL_SERVER
    ? ''
    : 'https://cqu-frean-guide-bwhdljnbcg.cn-hangzhou.fcapp.run';

  var busy = false;               // 是否正在等待回答
  var sessionId = '';             // 百炼的会话号，跟着「当前是哪段对话」走

  /* ==========================================================
     一、Markdown 渲染（自己实现，不引第三方库）
     先转义 HTML，再套用格式，杜绝注入
     ========================================================== */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---- 参考资料里的源文件：认出文档名，做成「下载」卡片 ---- */
  // 助手给的链接指向阿里云的一个临时地址，路径里的文件名是一串乱码。
  // 我们从链接**前面的文字**里把文档名抠出来（如「1. 《C区五舍》」），
  // 这样同学下载到的文件名就是人能看懂的。
  var KB_FILES = {};        // 链接 -> 文档名

  function scanFileNames(text){
    KB_FILES = {};
    var re = /https?:\/\/[^\s<>"'）)]*aliyuncs\.com[^\s<>"'）)]*/g;
    var m;
    while ((m = re.exec(text)) !== null){
      var url = m[0];
      if (KB_FILES[url]) continue;

      var before = text.slice(Math.max(0, m.index - 180), m.index);
      var name = '';
      var g = before.match(/《[^》\n]{1,50}》/g);
      if (g && g.length){
        name = g[g.length - 1].replace(/[《》]/g, '').trim();
      } else {
        var f = before.match(/[一-龥A-Za-z0-9_\-（）() ]{2,50}\.(?:docx?|pdf|txt|pptx?|xlsx?|md)/i);
        if (f) name = f[0].trim();
      }
      KB_FILES[url] = name;
    }
  }

  function fileCard(escapedUrl, name){
    var label = name || '原文';
    return '<span class="filecard" data-file="' + escapedUrl + '" data-name="' + esc(label) + '">' +
             '<span class="fc-name">📄 ' + esc(label) + '</span>' +
             '<span class="fc-btn">下载</span>' +
           '</span>';
  }

  // 知识库返回的文件链接又长又带签名参数，手机上能把气泡撑爆，
  // 所以只显示短标签；能认出文档名的，直接做成下载卡片
  function shortUrl(u){
    if (u.length <= 48) return u;
    var name = '';
    try { name = decodeURIComponent(u.split('?')[0].split('/').pop() || ''); } catch (e) { name = ''; }
    if (name && name.length <= 26 && /\.(pdf|docx?|txt|md|pptx?|xlsx?)$/i.test(name)) {
      return '📄 ' + name;
    }
    return '📄 原文链接';
  }

  function linkTag(url, text){
    // 传进来的 url 是转义过的（& 变成了 &amp;），查表前先还原
    var raw = String(url).replace(/&amp;/g, '&');
    if (KB_FILES[raw] !== undefined){
      return fileCard(url, KB_FILES[raw]);
    }
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' +
           (text.length > 48 ? shortUrl(text) : text) + '</a>';
  }

  // 行内格式：粗体、斜体、行内代码、链接
  function inline(s){
    return s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, function(m, text, url){
        return linkTag(url, text);
      })
      // 裸链接。注意：这里刻意不用「后行断言」，因为老版 iOS Safari 不支持，
      // 一旦语法报错整个页面会白屏。改成手工看前一个字符。
      .replace(/(https?:\/\/[^\s<]+)/g, function(m, url, offset, whole){
        var prev = offset > 0 ? whole.charAt(offset - 1) : '';
        if (prev && /[\w"'>=/]/.test(prev)) return m;   // 已在 href 属性里，别重复包装
        return linkTag(url, url);
      });
  }

  function splitRow(line){
    return line.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return c.trim(); });
  }

  function renderMarkdown(src){
    // 0. 先把「参考资料」里的源文件链接和文档名登记下来，
    //    下面渲染到这些链接时会变成下载卡片
    scanFileNames(src);

    // 1. 先把代码块抠出来占位，避免里面的符号被当成格式
    var codes = [];
    var t = String(src).replace(/```[^\n]*\n?([\s\S]*?)```/g, function(m, code){
      codes.push(code.replace(/\n$/, ''));
      return '\u0001C' + (codes.length - 1) + '\u0001';
    });

    // 2. 整体转义
    t = esc(t);
    var lines = t.split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      // 代码块占位符
      var cm = line.match(/^\u0001C(\d+)\u0001$/);
      if (cm){
        out.push('<pre><code>' + esc(codes[+cm[1]]) + '</code></pre>');
        i++; continue;
      }

      // 表格：本行是 |...|，下一行是 |---|---|
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
          /^\s*\|[\s:|\-]+\|\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') > -1){
        var head = splitRow(line), rows = [], j = i + 2;
        while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])){
          rows.push(splitRow(lines[j])); j++;
        }
        var tb = '<table><thead><tr>';
        head.forEach(function(c){ tb += '<th>' + inline(c) + '</th>'; });
        tb += '</tr></thead><tbody>';
        rows.forEach(function(r){
          tb += '<tr>';
          for (var k = 0; k < head.length; k++) tb += '<td>' + inline(r[k] || '') + '</td>';
          tb += '</tr>';
        });
        out.push(tb + '</tbody></table>');
        i = j; continue;
      }

      // 标题
      var hm = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (hm){
        var lv = Math.min(hm[1].length + 1, 4);
        out.push('<h' + lv + '>' + inline(hm[2]) + '</h' + lv + '>');
        i++; continue;
      }

      // 分隔线
      if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)){ out.push('<hr>'); i++; continue; }

      // 引用（注意：> 在前面的转义步骤里已经变成了 &gt;，两种都要认）
      if (/^\s*(?:&gt;|>)\s?/.test(line)){
        var qb = [];
        while (i < lines.length && /^\s*(?:&gt;|>)\s?/.test(lines[i])){
          qb.push(lines[i].replace(/^\s*(?:&gt;|>)\s?/, '')); i++;
        }
        out.push('<blockquote>' + inline(qb.join('<br>')) + '</blockquote>');
        continue;
      }

      // 列表（有序 / 无序）
      var lm = line.match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
      if (lm){
        var ordered = /\d/.test(lm[2]);
        var tag = ordered ? 'ol' : 'ul';
        var items = [];
        while (i < lines.length){
          var m2 = lines[i].match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
          if (!m2 || /\d/.test(m2[2]) !== ordered) break;
          var txt = m2[3];
          // 收拢该项的续行（缩进对齐的下一行）
          i++;
          while (i < lines.length && lines[i].trim() &&
                 !/^(\s*)([-*+]|\d+[.、)])\s+/.test(lines[i]) &&
                 !/^\s*(#{1,6}\s|&gt;|\|)/.test(lines[i]) &&
                 /^\s{2,}/.test(lines[i])){
            txt += '<br>' + lines[i].trim(); i++;
          }
          items.push('<li>' + inline(txt) + '</li>');
        }
        out.push('<' + tag + '>' + items.join('') + '</' + tag + '>');
        continue;
      }

      // 空行
      if (!line.trim()){ i++; continue; }

      // 普通段落
      var pb = [];
      while (i < lines.length && lines[i].trim() &&
             !/^\s*(#{1,6}\s|&gt;|\||```)/.test(lines[i]) &&
             !/^(\s*)([-*+]|\d+[.、)])\s+/.test(lines[i]) &&
             !/^\s*\u0001C\d+\u0001$/.test(lines[i])){
        pb.push(lines[i]); i++;
      }
      if (pb.length) out.push('<p>' + inline(pb.join('<br>')) + '</p>');
    }
    return out.join('');
  }

  /* ==========================================================
     二、界面渲染
     ========================================================== */
  function scrollBottom(){
    // 等一帧，让新内容先撑开高度
    requestAnimationFrame(function(){ main.scrollTop = main.scrollHeight; });
  }

  // 欢迎卡片只是藏起来，不删掉，这样开新对话时能原样复原
  function hideWelcome(){ if (welcome) welcome.style.display = 'none'; }

  function addMessage(role, text){
    var el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? '🙋' : '🎓';

    var bb = document.createElement('div');
    bb.className = 'bubble';
    if (role === 'user'){ bb.textContent = text; }
    else { bb.innerHTML = renderMarkdown(text); }

    el.appendChild(av); el.appendChild(bb);
    wrap.appendChild(el);
    scrollBottom();
    return bb;
  }

  function addTyping(){
    var el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = '<div class="avatar">🎓</div>' +
                   '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    wrap.appendChild(el);
    scrollBottom();
    return el;
  }

  function addError(text){
    var el = document.createElement('div');
    el.className = 'msg bot error';
    el.innerHTML = '<div class="avatar">⚠️</div><div class="bubble"></div>';
    el.querySelector('.bubble').textContent = text;
    wrap.appendChild(el);
    scrollBottom();
  }

  function setBusy(v){
    busy = v;
    btnSend.disabled = v || !input.value.trim();
    input.disabled = v;
  }

  /* ==========================================================
     二之二、历史对话记录（存在浏览器本地，不上传）
     ========================================================== */
  var STORE_KEY = 'cqu_history_v1';   // 浏览器里存对话的位置
  var MAX_CONV  = 60;                 // 最多留多少段对话
  var currentId = null;               // 当前正在看的是哪一段

  function storeRead(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Object.prototype.toString.call(arr) === '[object Array]' ? arr : [];
    } catch (e) { return []; }
  }

  function storeWrite(list){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
    catch (e) { /* 浏览器存满了就放弃，不打扰用户 */ }
  }

  // 只留有实际内容的对话，并把超量的老记录裁掉。
  // ⚠ 当前正在进行的这段即使还没提问也要留着 —— 否则刚建出来就被清掉，
  //   后面提问时就找不到它、记不进去了（这个坑踩过）
  function storeClean(){
    var list = storeRead().filter(function(c){
      if (!c || !c.msgs) return false;
      return c.msgs.length > 0 || c.id === currentId;
    });
    if (list.length > MAX_CONV) list = list.slice(0, MAX_CONV);
    storeWrite(list);
    return list;
  }

  function convFind(id, list){
    list = list || storeRead();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function convCreate(){
    // 先把「当前」清空，这样上一段没问过话的空壳会被 storeClean 顺手丢掉，
    // 不至于点几次「新对话」就堆出一串空记录
    currentId = null;
    var list = storeClean();

    var id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    list.unshift({ id: id, title: '', sid: '', time: Date.now(), msgs: [] });
    storeWrite(list);
    currentId = id;
    return id;
  }

  // 记一条消息（用户问的、助手答的都算）
  // id 可以指定记到哪段对话 —— 万一同学等不及、中途切走了，
  // 这条回答也要落回它原本所属的那段，而不是跑到新对话里
  function convPush(role, text, id){
    var target = id || currentId;
    if (!target) target = convCreate();

    var list = storeRead();
    var c = convFind(target, list);
    if (!c) return;

    c.msgs.push({ role: role, text: text });
    if (role === 'user' && !c.title){
      c.title = text.replace(/\s+/g, ' ').slice(0, 32);
    }
    c.time = Date.now();
    c.sid  = sessionId || c.sid || '';

    // 刚说过的排到最前面
    var idx = list.indexOf(c);
    if (idx > 0){ list.splice(idx, 1); list.unshift(c); }

    storeWrite(list);
    renderSidebar();
  }

  function groupLabel(ts){
    var now   = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (ts >= today)                  return '今天';
    if (ts >= today - 86400000)       return '昨天';
    if (ts >= today - 86400000 * 7)   return '最近 7 天';
    return '更早';
  }

  function renderSidebar(){
    var list = storeClean();
    sbList.innerHTML = '';

    if (!list.length){
      var tip = document.createElement('div');
      tip.className = 'sb-empty';
      tip.textContent = '还没有对话记录。问过的问题会自动存在这里，方便随时翻回来看。';
      sbList.appendChild(tip);
      return;
    }

    var lastGroup = '';
    list.forEach(function(c){
      var g = groupLabel(c.time);
      if (g !== lastGroup){
        var h = document.createElement('div');
        h.className = 'sb-group';
        h.textContent = g;
        sbList.appendChild(h);
        lastGroup = g;
      }

      var item = document.createElement('div');
      item.className = 'sb-item' + (c.id === currentId ? ' active' : '');
      item.setAttribute('data-id', c.id);

      var txt = document.createElement('div');
      txt.className = 'sb-text';
      txt.textContent = c.title || '（还没提问）';
      item.appendChild(txt);

      var del = document.createElement('button');
      del.className = 'sb-del';
      del.setAttribute('data-del', c.id);
      del.title = '删除这条记录';
      del.textContent = '×';
      item.appendChild(del);

      sbList.appendChild(item);
    });
  }

  function clearMessages(){
    Array.prototype.slice.call(wrap.querySelectorAll('.msg')).forEach(function(el){ el.remove(); });
  }

  // 打开某一段历史对话
  function convOpen(id){
    var c = convFind(id);
    if (!c) return;

    currentId = id;
    sessionId = c.sid || '';
    clearMessages();

    if (c.msgs.length){
      if (welcome) welcome.style.display = 'none';
      c.msgs.forEach(function(m){ addMessage(m.role, m.text); });
      main.scrollTop = main.scrollHeight;
    } else {
      if (welcome) welcome.style.display = '';
      main.scrollTop = 0;
    }
    renderSidebar();
    drawerClose();
  }

  // 开一段新对话（旧的不会丢，还在左边列表里）
  function convNew(){
    clearMessages();
    if (welcome) welcome.style.display = '';
    main.scrollTop = 0;
    sessionId = '';
    convCreate();
    renderSidebar();
    drawerClose();
    if (window.innerWidth > 820) input.focus();
  }

  function drawerOpen(){
    sidebar.classList.add('open');
    sbMask.classList.add('show');
  }
  function drawerClose(){
    sidebar.classList.remove('open');
    sbMask.classList.remove('show');
  }

  /* ==========================================================
     二之三、下载「参考资料」里的源文件
     ========================================================== */
  function downloadSource(card){
    if (!card || card.classList.contains('busy')) return;

    var url  = card.getAttribute('data-file') || '';
    var name = card.getAttribute('data-name') || '原文';
    if (!url) return;

    // 没有扩展名就补一个（知识库给的是转换后的纯文本）
    if (!/\.[a-z0-9]{2,5}$/i.test(name)) name += '.txt';

    var btn = card.querySelector('.fc-btn');
    var original = btn ? btn.textContent : '下载';
    card.classList.add('busy');
    if (btn) btn.textContent = '下载中…';

    function restore(){
      card.classList.remove('busy');
      if (btn) btn.textContent = original;
    }

    fetch(API_BASE + '/api/file?u=' + encodeURIComponent(url) + '&n=' + encodeURIComponent(name))
      .then(function(r){
        if (r.ok) return r.blob();
        return r.text().then(function(t){
          var msg = '下载失败';
          try { msg = JSON.parse(t).error || msg; } catch (e) { /* 不是 JSON 就用默认话术 */ }
          throw new Error(msg);
        });
      })
      .then(function(blob){
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        // ⚠ 别点完就立刻删掉！部分 Chrome 版本会因为元素消失而中断下载。
        //   等下载真正开始了再收拾。
        setTimeout(function(){
          a.remove();
          URL.revokeObjectURL(a.href);
        }, 3000);
        restore();
      })
      .catch(function(err){
        card.classList.add('fail');
        if (btn) btn.textContent = '下载失败';
        alert((err && err.message) || '下载失败，请稍后重试');
        setTimeout(function(){ card.classList.remove('fail'); restore(); }, 2200);
      });
  }

  /* ==========================================================
     三、发送 & 流式接收
     ========================================================== */
  function ask(prompt){
    if (busy || !prompt) return;

    var myConv = currentId;            // 记住这段回答属于哪段对话

    hideWelcome();
    addMessage('user', prompt);
    convPush('user', prompt, myConv);  // 记进左侧历史

    input.value = '';
    input.style.height = 'auto';
    setBusy(true);

    var typing  = addTyping();
    var bubble  = typing.querySelector('.bubble');
    var full    = '';
    var started = false;
    var failed  = false;

    // 这个助手是「想完了才一次性给答案」，要等十几到几十秒。
    // 光转三个点会让人以为卡死，所以按时间给几句进度提示。
    var timerA = null, timerB = null, timerC = null;
    timerA = setTimeout(function(){
      if (started || failed) return;
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                         '<span class="wait-tip">正在检索学院文件…</span>';
      scrollBottom();
    }, 3000);
    timerB = setTimeout(function(){
      if (started || failed) return;
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                         '<span class="wait-tip">正在整理答案，请稍候…</span>';
      scrollBottom();
    }, 12000);
    timerC = setTimeout(function(){
      if (started || failed) return;
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                         '<span class="wait-tip">问题比较复杂，还在思考中…</span>';
      scrollBottom();
    }, 30000);

    function clearWaitTimers(){
      clearTimeout(timerA); clearTimeout(timerB); clearTimeout(timerC);
    }

    // 出错时的收尾
    function fail(message){
      failed = true;
      clearWaitTimers();
      if (typing.parentNode) typing.remove();
      addError(message);
      // 让服务端忘掉这一轮，免得上下文错乱
      sessionId = '';
    }

    // 不管成功失败，最后都要走到这里：收尾、解锁输入框
    function finish(){
      clearWaitTimers();
      if (failed){
        /* fail() 里已经收拾过了 */
      } else if (full){
        // 等待动画就地「转正」成正式答案，只去掉闪烁光标
        bubble.innerHTML = renderMarkdown(full);
        convPush('bot', full, myConv); // 记进左侧历史
      } else {
        if (typing.parentNode) typing.remove();
        addError('助手这次没有返回内容，请再问一次试试。');
      }
      setBusy(false);
      if (window.innerWidth > 640) input.focus();
      scrollBottom();
    }

    fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, session_id: sessionId || undefined })
    })
    .then(function(resp){
      if (!resp.ok){
        return resp.text().then(function(t){
          var m = t;
          try { m = JSON.parse(t).error || t; } catch (e) { /* 不是 JSON 就直接用原文 */ }
          throw new Error(m || ('服务器返回 ' + resp.status));
        });
      }
      if (!resp.body) throw new Error('当前浏览器不支持流式接收');

      var reader  = resp.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';

      function pump(){
        return reader.read().then(function(r){
          if (r.done) return;

          buf += decoder.decode(r.value, { stream: true });

          // SSE 以空行分隔，最后一段可能不完整，留在缓冲里
          var parts = buf.split('\n\n');
          buf = parts.pop();

          for (var n = 0; n < parts.length; n++){
            var block = parts[n];
            var dataLines = block.split('\n').filter(function(l){
              return l.indexOf('data:') === 0;
            });
            if (!dataLines.length) continue;

            var payload = dataLines.map(function(l){ return l.slice(5).trim(); }).join('');
            if (payload === '[DONE]') return;

            var msg;
            try { msg = JSON.parse(payload); } catch (e){ continue; }

            if (msg.error) throw new Error(msg.error);

            if (msg.sid) sessionId = msg.sid;

            if (msg.t){
              if (!started){
                started = true;
                bubble.innerHTML = '';
              }
              full += msg.t;
              bubble.innerHTML = renderMarkdown(full) + '<span class="caret"></span>';
              scrollBottom();
            }
          }
          return pump();
        });
      }

      return pump();
    })
    .catch(function(err){
      fail('抱歉，没能拿到回答：' + (err && err.message ? err.message : err) +
           '\n\n请稍后重试，或换个说法再问一次。');
    })
    .then(finish);
  }

  /* ==========================================================
     四、事件绑定
     ========================================================== */
  btnSend.addEventListener('click', function(){ ask(input.value.trim()); });

  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    btnSend.disabled = busy || !input.value.trim();
  });

  input.addEventListener('keydown', function(e){
    // 电脑上：回车发送，Shift+回车换行；手机上回车就是换行
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 640){
      e.preventDefault();
      ask(input.value.trim());
    }
  });

  chips.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if (btn) ask(btn.textContent.trim());
  });

  // 「新对话」：旧的那段不会丢，还在左边列表里
  function onNewConv(){
    if (busy){ alert('助手还在回答，等它说完再开新对话吧'); return; }
    convNew();
  }
  btnReset.addEventListener('click', onNewConv);
  btnNew.addEventListener('click', onNewConv);

  // 手机上的抽屉式侧栏
  btnMenu.addEventListener('click', drawerOpen);
  sbMask.addEventListener('click', drawerClose);

  // 左侧列表：点一条打开它，点右边的 × 删掉它
  sbList.addEventListener('click', function(e){
    var del = e.target.closest ? e.target.closest('.sb-del') : null;
    if (del){
      e.stopPropagation();
      var id = del.getAttribute('data-del');
      if (!confirm('删除这条对话记录？删了就找不回来了。')) return;
      storeWrite(storeRead().filter(function(x){ return x.id !== id; }));
      if (id === currentId) convNew(); else renderSidebar();
      return;
    }
    var item = e.target.closest ? e.target.closest('.sb-item') : null;
    if (item){
      if (busy && item.getAttribute('data-id') !== currentId){
        alert('助手还在回答，等它说完再切换吧');
        return;
      }
      convOpen(item.getAttribute('data-id'));
    }
  });

  // 「参考资料」里的下载卡片
  wrap.addEventListener('click', function(e){
    var card = e.target.closest ? e.target.closest('.filecard') : null;
    if (!card) return;
    e.preventDefault();
    downloadSource(card);
  });

  /* ==========================================================
     五、启动
     ========================================================== */
  (function init(){
    var list = storeClean();
    if (list.length){
      convOpen(list[0].id);            // 接着上次看的对话，刷新不丢东西
    } else {
      convCreate();
      renderSidebar();
    }
    // 宽屏才自动聚焦，手机上不弹键盘
    if (window.innerWidth > 820) input.focus();
  })();
})();
</script>
</body>
</html>
